name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true          # cache .venv between runs on same branch

      - name: Install dependencies
        run: uv sync --dev --frozen

      # Hook environments are cloned and built on first use; cache them or
      # every run pays ~40s rebuilding the same pinned repos.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      # Runs every hook in .pre-commit-config.yaml — ruff, ruff-format and ty,
      # plus the whitespace/EOF/large-file/debug-statement/merge-conflict
      # checks that had no CI equivalent. One definition, enforced whether or
      # not a contributor ran `pre-commit install` locally.
      - name: Pre-commit (lint, format, type check)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest tests/ -x -q --tb=short
