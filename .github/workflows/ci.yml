name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    name: Lint & Test (Python 3.12)
    # Pinned, not `ubuntu-latest`. The image decides which Pythons exist and
    # which one uv picks, and this job spent eleven weeks red because of
    # exactly that: `ubuntu-latest` moved to 26.04 with 3.14, uv resolved a
    # project declaring only `>=3.12` to it, catboost 1.2.8 has no cp314 wheel,
    # and its sdist cannot build on modern setuptools. The runner is named
    # here so a change to the toolchain is a decision in a diff rather than
    # something that drifts in under the job.
    runs-on: ubuntu-24.04

    steps:
      # These three are on the Node 20 deprecation path: the runtime comes from
      # the action, and the old majors pin a Node GitHub is retiring.
      #
      # Note setup-uv's major tag lags its releases: the latest release is
      # v10.4.0 but the only major tags are up to v7. `@v10` fails to resolve
      # and takes the whole job down from `Set up job`, so this is `@v7` - the
      # current major tag, not the version number.
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true          # cache .venv between runs on same branch

      # `.python-version` is load-bearing, not decoration: catboost 1.2.8
      # publishes wheels for cp38-cp313 and none for cp314, and its sdist
      # cannot build on modern setuptools (`AttributeError: 'Distribution'
      # object has no attribute 'dry_run'`). `requires-python = ">=3.12"` has
      # no upper bound, so without the pin uv picks whatever the runner ships
      # — 3.14 on ubuntu-26.04 — falls back to the sdist, and CI dies before a
      # single test runs. Every run from 2026-09-06 to 2026-11-21 failed this
      # way while passing locally on a 3.12 venv. Bump the pin only together
      # with catboost.
      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Show interpreter
        run: uv run python -V

      # Hook environments are cloned and built on first use; cache them or
      # every run pays ~40s rebuilding the same pinned repos.
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      # Runs every hook in .pre-commit-config.yaml — ruff, ruff-format and ty,
      # plus the whitespace/EOF/large-file/debug-statement/merge-conflict
      # checks that had no CI equivalent. One definition, enforced whether or
      # not a contributor ran `pre-commit install` locally.
      - name: Pre-commit (lint, format, type check)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest tests/ -x -q --tb=short
