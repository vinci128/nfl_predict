repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        # `uv run` resolves ty from the project venv. A bare `ty check` needs
        # .venv/bin on PATH, which it is not under uv's normal usage (you run
        # `uv run ...` rather than activating), so the hook failed on every
        # commit with "Executable `ty` not found".
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
